# Local PostgreSQL for development: `docker compose up -d`
# Matches ConnectionStrings:Default in api/appsettings.Development.json.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: habits
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: habits
    ports:
      - "5432:5432"
    volumes:
      - habits-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  habits-postgres:
